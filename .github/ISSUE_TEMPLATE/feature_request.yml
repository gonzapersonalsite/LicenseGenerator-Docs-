name: Feature suggestion
description: Describe a workflow that could be improved.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to accomplish?
      description: Describe the current difficulty and who the improvement would help.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Include alternatives or examples if useful. Use invented data.
    validations:
      required: true
